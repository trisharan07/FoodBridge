services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: foodbridge
      POSTGRES_DB: foodbridge
    ports: ["5432:5432"]
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/migration_v2.sql:/docker-entrypoint-initdb.d/02_migration_v2.sql
      - ./database/migration_v3.sql:/docker-entrypoint-initdb.d/03_migration_v3.sql
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build: ./ml-service
    ports: ["5001:5001"]
    environment:
      PORT: 5001

volumes:
  pgdata:
